name: ✨ 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前可先看 [README.md](../../README.md) 的「能力范围」，确认该方向当前是否已经支持。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / 场景
      description: 这个功能解决什么痛点？现在你是怎么绕过的？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它以什么形式工作？（接口、界面、导出格式等）
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 文档解析（parsers）
        - 需求结构化（requirement）
        - 测试设计（design）
        - 导出（exporters）
        - LLM Provider（llm）
        - 外部集成（integrations）
        - 前端界面（frontend）
        - 文档 / 工程化
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false
