openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
  description: OpenAPI 3 fixture for interface asset regression.
servers:
  - url: https://petstore.example.com/api
security:
  - bearerAuth: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      tags:
        - REQ-PET-001
      parameters:
        - name: limit
          in: query
          required: true
          description: Page size
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Pet list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
              example:
                - id: 999
                  name: ExampleOnly
                  status: available
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createPet
      summary: Create a pet
      tags:
        - REQ-PET-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetInput"
            example:
              name: Fluffy
              status: available
      responses:
        "201":
          description: Created
          headers:
            X-Request-Id:
              description: Request trace id
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}:
    get:
      operationId: getPet
      summary: Get one pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9]+$"
      responses:
        "200":
          description: Pet detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PetInput:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        status:
          type: string
          enum:
            - available
            - pending
            - sold
    Pet:
      allOf:
        - $ref: "#/components/schemas/PetInput"
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              minimum: 1
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
